name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ランナーのXcodeが更新されるとシミュレーターの機種名が変わるため、
      # 使える iPhone シミュレーターを実行時に選ぶ
      - name: Pick simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          names = [d["name"] for runtime, devices in data.items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")]
          def key(n):
              m = re.search(r"(\d+)", n)
              return (int(m.group(1)) if m else 0, n)
          print(max(names, key=key) if names else "iPhone 16")
          ')
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      # ログはダウンロードできない環境からも結果を追えるよう、
      # コンパイルエラーと失敗したテストをアノテーション（::error::）として出す
      - name: Build & test
        run: |
          set +e
          xcodebuild test \
            -scheme LocalRecommend \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            2>&1 | tee build.log | grep -E --line-buffered "error:|Test Case .*(passed|failed)|\*\* TEST|\*\* BUILD|Executed"
          STATUS=${PIPESTATUS[0]}
          grep -E "error:|Test Case .* failed|failed \(" build.log | grep -vE "^\s*$" | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          if grep -q "\*\* TEST SUCCEEDED \*\*" build.log; then
            exit 0
          fi
          echo "::error::xcodebuild exited with status ${STATUS}"
          exit 1
